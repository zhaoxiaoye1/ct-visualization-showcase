<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三维可视化演示</title><link rel="stylesheet" href="style.css"></head><body class="viewer"><nav><a href="index.html" data-t="back"></a><button id="language">English</button></nav><main><header><h1 id="demoTitle"></h1><p id="demoText"></p></header><section><div class="panel"><div class="control"><button id="demoButton" data-t="play"></button></div><div class="view-labels"><strong id="leftTitle"></strong><strong id="rightTitle"></strong></div><img id="demoImage" class="animation" src="assets/contacts-poster.webp?v=20261121b" alt=""></div><p class="caption" id="demoNote"></p></section></main><script src="app.js?v=20261121c"></script><script>
const demo=new URLSearchParams(location.search).get('demo')==='motion'?'motion':'contacts',prefix=demo==='motion'?'motion':'contact';let playing=false;function demoRender(){document.getElementById('demoTitle').textContent=tr(prefix+'Title');document.getElementById('demoText').textContent=tr(prefix+'Text');document.getElementById('demoNote').textContent=tr(prefix+'Note');document.getElementById('leftTitle').textContent=tr(demo==='motion'?'global':'network');document.getElementById('rightTitle').textContent=tr(demo==='motion'?'local':'neighbors');document.getElementById('demoButton').textContent=tr(playing?'pause':'play');document.getElementById('demoImage').alt=tr(prefix+'Title');document.title=tr(prefix+'Title')}
document.getElementById('demoImage').src='assets/'+demo+'-poster.webp?v=20261121b';document.getElementById('demoButton').onclick=()=>{playing=!playing;document.getElementById('demoImage').src='assets/'+demo+(playing?'':'-poster')+'.webp?v=20261121b';demoRender()};const languageAction=document.getElementById('language').onclick;document.getElementById('language').onclick=()=>{languageAction();demoRender()};demoRender();
</script></body></html>
